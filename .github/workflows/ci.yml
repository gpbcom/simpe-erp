name: CI

on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_FILE: backend/.python-version
  NODE_VERSION: '20'

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend

  backend-types:
    name: Backend · ty
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --with 'ty==0.0.1a21' ty check
        working-directory: backend

  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  backend-integration:
    name: Backend · integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simple_erp
          POSTGRES_USER: simple_erp
          POSTGRES_PASSWORD: simple_erp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U simple_erp -d simple_erp"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: simple_erp
          RABBITMQ_DEFAULT_PASS: simple_erp_ci
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
      - run: uv sync --frozen
        working-directory: backend
      - name: Run the integration suite
        working-directory: backend
        env:
          POSTGRES_PASSWORD: simple_erp_ci
          RABBITMQ_PASSWORD: simple_erp_ci
          JWT_SECRET_KEY: ci-only-secret
        run: uv run pytest -q -m integration -n0
      - name: Run it a second time
        working-directory: backend
        env:
          POSTGRES_PASSWORD: simple_erp_ci
          RABBITMQ_PASSWORD: simple_erp_ci
          JWT_SECRET_KEY: ci-only-secret
        run: uv run pytest -q -m integration -n0

  frontend-lint:
    name: Front-end · lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run typecheck

  frontend-tests:
    name: Front-end · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run

  frontend-build:
    name: Front-end · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  openapi-drift:
    name: API · schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
      - run: uv sync --frozen
        working-directory: backend
      - name: Generate the schema
        working-directory: backend
        env:
          JWT_SECRET_KEY: ci-only-secret
        run: |
          uv run python -c "
          import json, pathlib
          from api.main import app
          pathlib.Path('../openapi.json').write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + '\n'
          )
          "
      - name: Fail if it moved
        run: git diff --exit-code -- openapi.json

  e2e-shards:
    name: E2E · shard lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 qa/shards/balance.py --check

  e2e-robot:
    name: E2E · Robot (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [e2e-shards]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bring the stack up
        run: |
          # Compose reads .env from the project directory, which is the
          # directory of the first -f file — not the checkout root.
          cp infra/compose/.env.example infra/compose/.env
          docker compose -f infra/compose/docker-compose.yaml -f infra/compose/docker-compose.dev.yaml \
            up -d --build

      - name: Wait for the API and the front-end
        run: |
          for _ in $(seq 1 60). Do
            curl -sf http://localhost:8000/ready && break || sleep 5
          done
          for _ in $(seq 1 60). Do
            curl -sf http://localhost:5173 >/dev/null && break || sleep 5
          done
          curl -sf http://localhost:8000/ready
      - name: Cache the campaign's dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
          key: rf-campaign-${{ runner.os }}-${{ hashFiles('qa/requirements.txt') }}

      - name: Install the campaign
        run: |
          pip install -r qa/requirements.txt
          rfbrowser init chromium

      - name: Run the campaign
        run: |
          robot --argumentfile qa/shards/4/${{ matrix.shard }}.args \
            --outputdir qa/results --xunit xunit.xml qa/robot/suites

      - name: Run it a second time
        run: |
          robot --argumentfile qa/shards/4/${{ matrix.shard }}.args \
            --outputdir qa/results-rerun --xunit xunit.xml qa/robot/suites

      - name: Dump the container logs
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.yaml -f infra/compose/docker-compose.dev.yaml \
            logs --no-color --tail 400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results-${{ matrix.shard }}
          path: |
            qa/results
            qa/results-rerun
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-coverage-raw-${{ matrix.shard }}
          path: qa/results/coverage-raw
          retention-days: 14

      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Robot Framework (shard ${{ matrix.shard }})
          path: qa/results/xunit.xml
          reporter: java-junit

  e2e-coverage:
    name: E2E · coverage
    runs-on: ubuntu-latest
    needs: [e2e-robot]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: robot-coverage-raw-*
          path: qa/results/shard-coverage

      - name: Fail if a shard's coverage went missing
        run: |
          shards=$(ls qa/results/shard-coverage 2>/dev/null | wc -l)
          echo "$shards of 4 shards reported coverage."
          test "$shards" -eq 4

      - name: Union the shards' raw output
        run: |
          mkdir -p qa/results/coverage-raw
          cp -r qa/results/shard-coverage/*/. qa/results/coverage-raw/
          echo "$(ls qa/results/coverage-raw | wc -l) suite(s) recorded coverage."

      - name: Install the campaign
        run: |
          pip install -r qa/requirements.txt
          rfbrowser init --skip-browsers

      - name: Merge every shard's coverage into one report.
        run: |
          robot --outputdir qa/results \
            --variable COVERAGE_RAW_DIR:${{ github.workspace }}/qa/results/coverage-raw \
            qa/robot/suites/99_coverage_report.robot

      - name: Report the measured coverage
        if: always()
        run: |
          if [ -f qa/results/coverage/coverage-summary.json ]. Then
            python - <<'PY'
          import json, pathlib
          data = json.loads(
              pathlib.Path("qa/results/coverage/coverage-summary.json").read_text()
          )
          summary = data.get("summary", data)
          print("## Front-end coverage")
          for metric, value in summary.items():
              if isinstance(value, dict) and "pct" in value:
                  print(f"- {metric}: {value['pct']}%")
          PY
          else
            echo "No coverage summary was produced." >&2
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: qa/results/coverage
          retention-days: 14

  docker-build:
    name: Images · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend and worker
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Front-end
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
