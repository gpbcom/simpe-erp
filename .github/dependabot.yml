version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # MUI ships its packages in lockstep and they must be upgraded together;
      # five separate pull requests would each fail against the other four.
      mui:
        patterns: ['@mui/*']
      fullcalendar:
        patterns: ['@fullcalendar/*']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
