<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" role="img"
     aria-label="SimpleERP — aide à domicile">
  <title>SimpleERP</title>
  <!--
    For a light page.

    A README variant of the application mark. It differs from
    frontend/src/assets/brand/logo-full.svg in exactly one way: the wordmark
    carries an explicit ink rather than `currentColor`. A README is rendered as
    an <img>, where `currentColor` has nothing to inherit from and falls back to
    black — which disappears entirely against a dark page.
  -->
  <defs>
    <linearGradient id="simpleErpLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F6E6E" />
      <stop offset="100%" stop-color="#12A19A" />
    </linearGradient>
  </defs>
  <g transform="translate(6, 9)">
    <path d="M6 22 L24 7 L42 22" fill="none" stroke="url(#simpleErpLight)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24 40 C16 33 12 29.5 12 25.5 A5.5 5.5 0 0 1 24 22.5 A5.5 5.5 0 0 1 36 25.5 C36 29.5 32 33 24 40 Z"
          fill="url(#simpleErpLight)" />
    <path d="M8.5 30 A9 9 0 0 0 13 38.5" fill="none" stroke="#C8791A" stroke-width="3" stroke-linecap="round" />
    <path d="M39.5 30 A9 9 0 0 1 35 38.5" fill="none" stroke="#C8791A" stroke-width="3" stroke-linecap="round" />
  </g>
  <!--
    `textLength` with `lengthAdjust="spacingAndGlyphs"` pins the wordmark to an
    exact advance width, whatever font actually resolves. Without it the mark is
    only as wide as the renderer's font choice makes it: `Inter` is named first
    but is not loaded anywhere, so a browser falls back to `system-ui` and a
    converter falls back to something else again — and a frame cut to fit one of
    them clips the others. It did: the application's own header rendered
    "SimpleER".
  -->
  <text x="62" y="38" textLength="130" lengthAdjust="spacingAndGlyphs" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" font-weight="600" letter-spacing="-0.6" fill="#0F2D2D">SimpleERP</text>
  <text x="63" y="54" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="10.5" font-weight="400" letter-spacing="0.3" fill="#5B7B7A">aide à domicile</text>
</svg>
