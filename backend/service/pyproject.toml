[project]
name = "service"
version = "0.1.0"
description = "Business-logic layer for the rt-erp backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "models",
    "storage",
    "ortools>=9.15.6755",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service"]

[tool.uv.sources]
models = { workspace = true, editable = true }
storage = { workspace = true, editable = true }
