# simple-erp backend configuration, for the docker-compose stack.
#
# Identical to app.yaml except for the three addresses a container cannot
# reach on localhost: PostgreSQL, MinIO, and the browser-facing URL the
# photograph links are built from. Selected with SIMPLE_ERP_CONFIG.
#
# Secrets are never stored here: a ``*_env`` key names the environment variable
# that carries the value, and the secret is resolved at connection time.

server:
  host: 0.0.0.0
  port: 8000
  title: SimpleERP API
  version: 1.0.0
  # Named explicitly rather than "*": the API answers credentialed requests, so
  # a wildcard origin would let any site drive it with a logged-in user's token.
  cors_origins:
    - http://localhost:5173
    - http://localhost:4173

database:
  host: postgres
  port: 5432
  database: simple_erp
  username: simple_erp
  password_env: POSTGRES_PASSWORD
  pool_size: 10
  max_overflow: 5
  pool_timeout_seconds: 30.0
  echo_sql: false

auth:
  jwt_secret_env: JWT_SECRET_KEY
  jwt_algorithm: HS256
  access_token_expire_minutes: 720
  # On for the development and demonstration stack, which holds seeded
  # records rather than real ones. Deliberately absent from app.yaml's
  # posture: a company is not yet a tenancy boundary, so an administrator
  # founded here can read every agency's data.
  allow_company_registration: true

pricing:
  # Contractual base rate, excluding tax, in EUR per hour.
  base_hourly_rate_ht: 31.905
  # Fractional uplifts, not percentages: 0.25 means +25%.
  weekday_surcharges:
    sunday: 0.25
  # Surcharges are never cumulative — a date matching several rules takes the
  # single largest uplift, so 1 January falling on a Sunday bills at +50%.
  holiday_surcharges:
    - month: 12
      day: 25
      surcharge: 0.50
      label: Christmas Day
    - month: 1
      day: 1
      surcharge: 0.50
      label: New Year's Day

planning:
  # The six values below all SEED the stored planning settings the first time
  # they are read. After that a manager owns them through
  # PUT /api/v1/planning/settings, and this file is not consulted again —
  # editing it here will not move a running deployment.
  #
  # Minutes from midnight: 540 = 09:00, 1200 = 20:00.
  day_start_minute: 540
  day_end_minute: 1200
  # The business floor is one hour; the value is configurable by requirement.
  lunch_break_minutes: 60
  lunch_window_start_minute: 690   # 11:30
  lunch_window_end_minute: 870     # 14:30
  max_intervention_radius_km: 30.0
  # Average speeds used to turn a straight-line distance into a duration.
  # Not seeded: these are a property of the road network, not an agency rule.
  average_speed_kmh: 30.0
  average_speed_without_license_kmh: 12.0
  # A safety net, not a budget. It bounds a pathological instance; a solve
  # that reaches it has stopped being reproducible and says so at WARNING.
  # It must stay well above what the budget below actually costs in seconds,
  # or the net truncates every search — the Helm chart shipped that mistake,
  # and both it and the config tests now refuse a net under eight times the
  # budget.
  solver_time_limit_seconds: 3600.0
  # **The setting that decides whether a week's work all gets placed —
  # and a measured trade-off, with neither side of it free.**
  #
  # It was 1, for reproducibility: parallel workers race to the incumbent,
  # so re-planning an unchanged week returned 404 minutes of travel, then
  # 371, then 355 — three numbers a manager cannot tell apart from a real
  # improvement. It was tempting to assume the deterministic budget below
  # had since removed that race, since it was introduced for exactly that
  # reason. **It has not.** Solving one unchanged week three times at eight
  # workers gave 243, 250 and 242 travel minutes, with the placements
  # themselves differing — a deterministic budget fixes *when* the search
  # stops, not which worker reached the incumbent first.
  #
  # What one worker costs is the other half: it cannot place the seeded
  # 77-visit week at any budget tried, and a run that leaves work unplaced
  # is refused outright rather than stored, so the agency gets no plan at
  # all. Eight workers place all 77 every time and roughly halve the travel.
  #
  # Eight is set here because no plan is worse than a plan that moves by
  # three percent between runs. If that judgement is wrong for an agency,
  # this is the one line to change.
  #
  # Keep equal to the CPU the process is actually given. More threads than
  # cores and the kernel throttles the whole cgroup under a container limit.
  solver_workers: 8
  solver_seed: 0
  # The budget that actually stops the search, measured in work rather
  # than in seconds. solver_time_limit_seconds is only a safety net: if
  # it fires, the run logs a WARNING and is no longer reproducible.
  #
  # Re-measured on the seeded agency — 12 assistants, 77 visits over
  # 2026-08-10..16 — after `list_schedulable` gained its ORDER BY. That
  # matters: the previous sizing here recorded 15.0 and 40.0 both placing
  # all 77, but it was taken while PostgreSQL was free to return the rows
  # in any order, so it had been tuned to one arbitrary ordering. With the
  # order fixed, the same settings leave visits stranded.
  #
  #   workers  budget   wall    unplaced   travel
  #         1    20.0    138s          2        —
  #         1    40.0    228s          2      496
  #         1    80.0   >300s          1      449   (hit the net)
  #         8    40.0    576s          0      243
  #
  # **Budget is not the lever; worker count is.** Doubling the budget on
  # one worker changed nothing, and the run that fails tells the operator
  # to raise the budget — advice this table shows to be wrong on this
  # instance. Eight workers place the week outright and roughly halve the
  # travel.
  #
  # Not yet measured: 8 workers at a smaller budget. The wall clock above
  # is ten minutes, so if 20.0 also places all 77 it is worth having.
  # **Re-sized after a 95-visit week left one visit unplaced at a budget of
  # 100.0.** The run's own diagnosis says to raise the budget, and that
  # advice was half right: the budget was never spent. The table below
  # measures 40.0 units costing 576s across eight workers — about 14.4
  # seconds of wall clock per unit — so a budget of 100.0 needs some 1440s,
  # and the net above was 900.0. Every solve was cut short by the clock,
  # which is what an unplaced visit at status FEASIBLE looks like.
  #
  # So both moved: the net is now well clear of what the budget costs, and
  # the budget itself is raised by half, because the week that failed is
  # 95 visits where every figure below was measured on 77.
  solver_deterministic_budget: 150.0
  travel_weight: 1
  # Must dominate any realistic travel cost, so leaving a requirement
  # unassigned stays a last resort rather than a cheap way to avoid a drive.
  unassigned_penalty: 100000

geocoding:
  # Nominatim resolves a postal address to a coordinate during model
  # validation. Its usage policy requires an identifying User-Agent and, on the
  # public instance, at most one request per second. The User-Agent is sent;
  # the rate is NOT throttled by this application, so a deployment entering
  # addresses in bulk should point base_url at its own Nominatim instance or
  # risk having its address blocked.
  base_url: https://nominatim.openstreetmap.org/search
  user_agent: "simple-erp/0.1 (home-care planning; contact: ops@simple-erp.local)"
  timeout_seconds: 10.0
  country_codes:
    - fr

s3:
  # Assistant photographs are stored here; the HCA record holds the object URL.
  bucket: simple-erp
  region: fr-par
  # MinIO stands in for S3 in the stack; the bucket is created on boot.
  endpoint_url: http://minio:9000
  # Set public_base_url when the URL a browser fetches differs from the
  # endpoint the backend writes through (a CDN, or an in-cluster address).
  #
  # **It replaces the endpoint *and* the bucket, not the endpoint alone.**
  # ``build_public_url`` appends the key straight onto it — the CDN case it
  # exists for is a host mapped at the bucket's root — so a value naming only
  # the host makes MinIO read the key's first segment as the bucket name and
  # answer 403 AccessDenied for a bucket called 'hca-photos'. A browser cannot
  # resolve 'minio', so the host is localhost; the '/simple-erp' is the bucket
  # MinIO serves path-style, and leaving it off is what breaks every avatar.
  public_base_url: http://localhost:9000/simple-erp
  access_key_env: S3_ACCESS_KEY
  secret_key_env: S3_SECRET_KEY
  photo_key_prefix: hca-photos/
  max_upload_bytes: 5242880   # 5 MiB

rabbitmq:
  # Carries the quote-validation events and the planning runs. Disabled by
  # default so a developer running the API alone is not blocked by the absence
  # of a broker: a publish that cannot connect is logged and dropped, and the
  # database still holds every fact the message would have carried.
  enabled: true
  host: rabbitmq
  port: 5672
  virtual_host: /
  username: simple_erp
  password_env: RABBITMQ_PASSWORD
  exchange: simple-erp
  publish_timeout_seconds: 5.0
  # One at a time: the heaviest consumer runs an OR-Tools solve, which pins a
  # core for its whole budget. Taking a second message while the first solves
  # would only delay acknowledging both.
  prefetch: 1

webhook:
  # Off, like app.yaml: emailing every assistant and every customer is a
  # decision, not a default. The URL is corrected regardless, so switching it
  # on is one flag rather than a flag and a debugging session — the caller is
  # the worker container, where localhost is the worker itself.
  enabled: false
  url: http://backend:8000/api/v1/webhooks/planning-completed
  token_env: PLANNING_WEBHOOK_TOKEN
  timeout_seconds: 30.0

observability:
  service_name: simple-erp
  metrics_enabled: true
  metrics_port: 9100
  tracing_enabled: false
  otlp_endpoint: http://otel-collector:4317
  export_timeout_seconds: 10.0
