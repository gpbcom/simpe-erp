[project]
name = "models"
version = "0.1.0"
description = "Shared data models and schemas for the simple-erp backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic[email]>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "phonenumbers>=9.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]
