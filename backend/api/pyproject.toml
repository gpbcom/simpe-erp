[project]
name = "api"
version = "0.1.0"
description = "HTTP entry point for the simple-erp backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "models",
    "service",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.20",
    "colorlog>=6.10.1",
    "pyyaml>=6.0",
]

[project.scripts]
api = "api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
models = { workspace = true, editable = true }
service = { workspace = true, editable = true }
