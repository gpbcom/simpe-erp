[project]
name = "storage"
version = "0.1.0"
description = "Persistence layer (repositories and database access) for the rt-erp backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "models",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "alembic>=1.14.0",
    "greenlet>=3.5.0",
    "boto3>=1.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.uv.sources]
models = { workspace = true, editable = true }
