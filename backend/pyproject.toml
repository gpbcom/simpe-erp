[project]
name = "backend"
version = "0.1.0"
description = "simple-erp backend — uv workspace aggregating the models, storage, service and api packages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "models",
    "storage",
    "service",
    "api",
    "worker",
    "seed",
]

[tool.uv.workspace]
members = [
    "models",
    "storage",
    "service",
    "api",
    "worker",
    "seed",
]

# Every member resolves to the local checkout, installed in editable mode: a
# change under ``<member>/src`` is picked up without a re-install. Declared at
# the workspace root so the members inherit it, and repeated in each member
# that depends on another so a member is never resolved from PyPI by mistake
# (``models``, ``storage``, ``service`` and ``api`` are all plausible public
# distribution names).
[tool.uv.sources]
models = { workspace = true, editable = true }
storage = { workspace = true, editable = true }
service = { workspace = true, editable = true }
api = { workspace = true, editable = true }
worker = { workspace = true, editable = true }
seed = { workspace = true, editable = true }

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
ignore = [
    "E402",    # module-import-not-at-top-of-file
    "F541",    # f-string-missing-placeholders
    # The house typing convention is deliberately pre-PEP-585/604: capitalised
    # `typing.Dict`/`List`/`Tuple`, `Optional[X]` and `Union[A, B]`. These four
    # rules exist to rewrite exactly that style, so they are off by design and
    # not by neglect.
    "UP006",   # non-pep585-annotation      (Dict -> dict)
    "UP007",   # non-pep604-annotation-union (Union[A, B] -> A | B)
    "UP035",   # deprecated-import           (typing.Dict)
    "UP045",   # non-pep604-annotation-optional (Optional[X] -> X | None)
    "UP046",   # non-pep695-generic-class  (Generic[T] -> class C[T])
    "UP047",   # non-pep695-generic-function
    # `Union[int, float]` collapses to `float` under PEP 484 numeric coercion,
    # but the validators branch on `isinstance(value, int)` to reject bools, so
    # the two are genuinely distinct here.
    "PYI041",  # redundant-numeric-union
    # Money is always constructed from a string: `Decimal("0.55")` is exact,
    # `Decimal(0.55)` picks up the binary approximation.
    "FURB157", # verbose-decimal-constructor
    # `# noqa: E501` comments are maintained by the editor's formatter at a
    # narrower width than ruff's, so ruff sees some of them as redundant.
    "RUF100",  # unused-noqa
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`, `Query(...)` and friends in argument defaults are how FastAPI
# declares dependencies and parameter metadata — the framework evaluates them
# per request, so B008's "mutable default" reasoning does not apply. This is
# the exemption FastAPI's own documentation prescribes.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.isort]
known-first-party = ["models", "storage", "service", "api"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Run the suite across all CPU cores by default (pytest-xdist). Pass ``-n0``
# to fall back to a single in-process run when debugging (live output, pdb).
# ``--timeout`` is a safety net: no unit test should run this long, so a hang
# (e.g. an unmocked database call) fails fast instead of blocking CI.
addopts = "-n auto --timeout=60 -m 'not integration and not performance'"
testpaths = ["tests"]
# Makes ``tests`` importable as a package, so shared fixtures can live in
# ``tests/planning_scenarios/`` and be imported by name from any test module.
# Without it pytest only puts each test file's own directory on the path, and a
# fixture package shared by several suites has nowhere to live that is not the
# shipped application — which is the wrong place for instances that exist only
# to be solved.
pythonpath = ["."]
# ``geocoding`` opts a test out of the autouse fixture that neutralises the
# Nominatim lookup, so it can drive the real code through a stubbed transport.
markers = [
    "geocoding: exercises the Nominatim lookup itself, with a stubbed transport",
    # Needs the development stack up: Mailpit, RabbitMQ, PostgreSQL. Excluded
    # from the default run so `uv run pytest` stays hermetic on a laptop, and
    # selected explicitly by the CI job that starts those services.
    "integration: exercises a real external service rather than a stub",
    # Minutes of CPU rather than milliseconds, so excluded from the default run
    # and selected with `-m performance`. These time the solver on week-sized
    # instances; they are measurements first and assertions second.
    "performance: times the solver on a week-sized instance",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    # Capped below 0.15 deliberately. From 0.15 onwards `ruff format` rewrites
    # `except (A, B):` into `except A, B:` — Python 2 syntax, and a SyntaxError
    # on 3.14 — for handlers at method depth. It corrupted nine files here, and
    # the suite stayed green because CPython kept importing the `.pyc` compiled
    # from the previous, correct source. Bisected: 0.14.0 clean, 0.15.4 and
    # 0.16.1 corrupt. `tests/test_sources_are_parseable.py` is the backstop if
    # this cap is ever lifted without checking.
    "ruff>=0.11.0,<0.15",
]

[tool.ty.environment]
# Resolve first-party imports against the workspace's own virtualenv rather
# than whatever VIRTUAL_ENV happens to be set to. Without this, ty resolves
# against the ambient environment and reports several hundred phantom
# unresolved-import errors that say nothing about this code.
python = ".venv"

[tool.ty.src]
# ``tests`` is excluded deliberately, and it is the larger half of the tree.
# This suite's job is to feed wrong types to validators and assert they are
# refused — ``Customer(first_name=123)`` is the *point* of that test, not a
# defect in it. Type-checking it produces roughly nine hundred diagnostics that
# all say "this test does what it was written to do", which would bury the
# couple of hundred findings in ``src`` that are worth reading.
exclude = [".venv", "conf/alembic/versions", "tests"]

[tool.ty.rules]
# The generic mapper contract, stated once here rather than silenced at each of
# the ninety call sites. BaseMapper is generic over ModelType/RowType and reads
# `model.id`, `row.created_at` and `row.updated_at` — attributes every persisted
# model has, and that the `BaseModel`/`Base` bounds cannot express. The class
# docstring says so explicitly; this is that decision, told to the checker.
#
# Scoped to a warning rather than ignored outright, so a *genuine* missing
# attribute elsewhere still shows up in the output — it simply does not fail
# the build while the burn-down described in the CI workflow is in progress.
unresolved-attribute = "warn"
