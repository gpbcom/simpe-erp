[project]
name = "seed"
version = "0.1.0"
description = "Idempotent development data for the rt-erp stack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "models",
    "storage",
    "service",
]

[project.scripts]
seed = "seed.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]

[tool.uv.sources]
models = { workspace = true, editable = true }
storage = { workspace = true, editable = true }
service = { workspace = true, editable = true }
