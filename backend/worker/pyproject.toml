[project]
name = "worker"
version = "0.1.0"
description = "Background worker consuming the rt-erp event broker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "models",
    "storage",
    "service",
]

[project.scripts]
worker = "worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
models = { workspace = true, editable = true }
storage = { workspace = true, editable = true }
service = { workspace = true, editable = true }
