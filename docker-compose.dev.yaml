# rt-erp — development overlay.
#
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
#
# What development needs and production must not have: every port published so
# a developer can reach the database and the broker directly, source bind-mounted
# so a save reloads rather than rebuilds, a mail catcher instead of a real SMTP
# relay, and a seeder that fills the database with something to look at.

services:
  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"   # console

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: rt_erp / rt_erp_dev

  # Catches every outbound email instead of delivering it. MP_SMTP_AUTH_ACCEPT_ANY
  # is load-bearing rather than convenience: EmailService._deliver calls login()
  # unconditionally, so a stub that refuses authentication fails every send
  # before a message is ever built.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI and REST API the tests assert against
    networks: [rt-erp]

  backend:
    build:
      context: ./backend
    environment:
      RT_ERP_CONFIG: conf/app.dev.yaml
    volumes:
      # Source is mounted over the image's copy, so editing a file reloads the
      # process. The virtualenv is deliberately NOT mounted: it belongs to the
      # image, and shadowing it with the host's would break the moment the two
      # disagree about a platform wheel.
      - ./backend/api/src:/app/api/src
      - ./backend/models/src:/app/models/src
      - ./backend/service/src:/app/service/src
      - ./backend/storage/src:/app/storage/src
      - ./backend/worker/src:/app/worker/src
      - ./backend/conf:/app/conf
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic -c conf/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    environment:
      RT_ERP_CONFIG: conf/app.dev.yaml
    volumes:
      - ./backend/api/src:/app/api/src
      - ./backend/models/src:/app/models/src
      - ./backend/service/src:/app/service/src
      - ./backend/storage/src:/app/storage/src
      - ./backend/worker/src:/app/worker/src
      - ./backend/conf:/app/conf

  # Fills the database with a working agency: accounts, assistants with
  # photographs, customers, a catalog, quotes in every status and one completed
  # planning run. Idempotent, so `up` a second time changes nothing.
  seed:
    build:
      context: ./backend
    environment:
      RT_ERP_CONFIG: conf/app.dev.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt_erp_dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rt_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rt_erp_dev_secret}
    depends_on:
      backend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/seed/src:/app/seed/src
      - ./backend/conf:/app/conf
    command: ["seed"]
    restart: "no"
    networks: [rt-erp]

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      # An anonymous volume so the container keeps the node_modules it installed
      # rather than having them hidden by the host's — which are built for a
      # different platform and would fail on the first native dependency.
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
