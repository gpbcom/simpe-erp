services:
  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"   # console

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: simple_erp / simple_erp_dev
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI and REST API the tests assert against
    networks: [simple-erp]

  backend:
    build:
      context: ./backend
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
    volumes:
      - ./backend/api/src:/app/api/src
      - ./backend/models/src:/app/models/src
      - ./backend/service/src:/app/service/src
      - ./backend/storage/src:/app/storage/src
      - ./backend/worker/src:/app/worker/src
      - ./backend/conf:/app/conf
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic -c conf/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
    volumes:
      - ./backend/api/src:/app/api/src
      - ./backend/models/src:/app/models/src
      - ./backend/service/src:/app/service/src
      - ./backend/storage/src:/app/storage/src
      - ./backend/worker/src:/app/worker/src
      - ./backend/conf:/app/conf
  seed:
    build:
      context: ./backend
    image: simple-erp-backend:local
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp_dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-simple_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-simple_erp_dev_secret}
    depends_on:
      backend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/seed/src:/app/seed/src
      - ./backend/conf:/app/conf
    command: ["seed"]
    restart: "no"
    networks: [simple-erp]

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
