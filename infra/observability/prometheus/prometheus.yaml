global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: simple-erp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: simple-erp-api
  - job_name: simple-erp-worker-planning
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-planning:9100"]
        labels:
          service: simple-erp-worker-planning

  - job_name: simple-erp-worker-notifications
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-notifications:9100"]
        labels:
          service: simple-erp-worker-notifications
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
