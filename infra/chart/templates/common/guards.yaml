{{/*
Render-time checks. Nothing here produces an object; the file exists so that a
values file which cannot work fails `helm template` rather than a deployment.

Each of these is a mistake that is silent at runtime — the pods start, report
Ready, and do the wrong thing.
*/}}

{{/*
solver_workers against the planning worker's CPU limit.

With more threads than cores the kernel throttles the whole cgroup, so the
wall-clock net below arrives after less real search — and the run still reports
as having used its allowance, so the only symptom is a queue that will not
drain. It was hard-coded at 8 against a two-core container, which is exactly
that shape.
*/}}
{{- $cpu := .Values.workerPlanning.resources.limits.cpu -}}
{{- $workers := .Values.workerPlanning.solverWorkers -}}
{{- if ne (printf "%v" $cpu) (printf "%v" $workers) }}
{{- fail (printf "workerPlanning.solverWorkers (%v) must equal workerPlanning.resources.limits.cpu (%v). The solver's budget is wall-clock, so more threads than cores means the kernel throttles the cgroup and thirty seconds of budget takes a minute of real time." $workers $cpu) }}
{{- end }}

{{/*
Guaranteed QoS for the planning worker.

Requests must equal limits, or the pod is Burstable and the CPU it was sized
for is a ceiling rather than a reservation — which is the throttling above,
arrived at from the other side.
*/}}
{{- if ne (printf "%v" .Values.workerPlanning.resources.requests.cpu) (printf "%v" $cpu) }}
{{- fail (printf "workerPlanning CPU request (%v) must equal its limit (%v): the planning worker needs Guaranteed QoS, or its wall-clock solve budget is throttled away." .Values.workerPlanning.resources.requests.cpu $cpu) }}
{{- end }}

{{/*
The wall-clock net against the deterministic budget.

These two measure different things — work units and seconds — so nothing makes
them agree by construction, and getting it wrong is silent. This file itself
shipped the mistake: it set the net to 30.0 and never set the budget at all, so
a cluster ran every solve into the net long before the budget was spent,
truncated the search, and left visits unplaced that a full search places.

The ratio is a sanity floor, not a prediction, and **it was calibrated on the
wrong worker count**. A 77-visit week spends a budget of 20.0 in about 138
seconds on *one* worker — near seven seconds per work unit — and eight was set
from that. But the shipped configuration runs eight workers, where the same
measurements record 40.0 units costing 576 seconds: about fourteen and a half
seconds per unit, twice the figure the floor was drawn from.

So the floor passed the very configuration it exists to catch. Every config
file shipped a net of 900.0 against a budget of 100.0 — some 1440 seconds of
work — and a 95-visit week came back one visit short at status FEASIBLE, which
is what a search truncated by the clock looks like from the outside.

Twenty, therefore, against the eight-worker cost with room for slower hardware.
Raising the worker count does not reduce the seconds a unit costs; it buys more
search inside each one. A solve that hits the net still says so at WARNING.
*/}}
{{- $budget := .Values.workerPlanning.solverDeterministicBudget -}}
{{- $net := .Values.workerPlanning.solverTimeLimitSeconds -}}
{{- if lt (float64 $net) (mulf $budget 20) }}
{{- fail (printf "workerPlanning.solverTimeLimitSeconds (%v) is below twenty times solverDeterministicBudget (%v). A work unit costs about fourteen seconds of wall clock at eight workers, so the net would stop every solve before its reproducible budget was spent: the search is truncated, visits go unplaced at status FEASIBLE, and every run logs that its plan is not reproducible." $net $budget) }}
{{- end }}

{{/*
The grace period against how long a solve actually takes.

Kubernetes' default is thirty seconds and a real solve is minutes, so a
scale-down would SIGKILL mid-solve. That loses no work — the message is
unacknowledged and another replica takes it — but it repeats the whole solve,
and a draining deployment can do that indefinitely.

Held against the *budget's* measured cost rather than the net: covering the net
would mean a grace period of ten minutes per pod on every rolling deploy, to
insure against a pathological instance that redelivery already handles.
*/}}
{{- if lt (int .Values.workerPlanning.terminationGracePeriodSeconds) 60 }}
{{- fail (printf "workerPlanning.terminationGracePeriodSeconds is %v, which does not leave a solve time to finish and acknowledge. Kubernetes would SIGKILL mid-solve on every scale-down, and the run would be repeated from the start on another replica." .Values.workerPlanning.terminationGracePeriodSeconds) }}
{{- end }}

{{/*
The notification worker must not scale to zero.

A badge should be instant, and a cold start is not.
*/}}
{{- if eq (int .Values.workerNotifications.scaling.minReplicas) 0 }}
{{- fail "workerNotifications.scaling.minReplicas must be at least 1: a notification is answered in milliseconds, and a cold start is not." }}
{{- end }}
