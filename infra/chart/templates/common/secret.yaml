{{/*
The secret, written by External Secrets from whatever store the cluster has.

Nothing here holds a value. The keys are the *_env names the YAML
configuration points at, so a rotation is a change in the secret store and a
pod restart — never a rebuild, and never a value in git.
*/}}
{{- if .Values.secrets.storeName }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "simple-erp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.storeName }}
    kind: {{ .Values.secrets.storeKind }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    {{/*
EINVOICING_CREDENTIAL_KEY is unlike every other key here: the others are
credentials for something this cluster can be given again, and that one is the
only thing that can read an agency's stored platform credentials back.
**Losing it means every agency must re-enter its platform API key**, so the
store holding it needs the same backup discipline as the database.
*/}}
    {{- range $key := list "POSTGRES_PASSWORD" "JWT_SECRET_KEY" "S3_ACCESS_KEY" "S3_SECRET_KEY" "RABBITMQ_PASSWORD" "SMTP_USERNAME" "SMTP_PASSWORD" "PLANNING_WEBHOOK_TOKEN" "BILLING_WEBHOOK_TOKEN" "EINVOICING_CREDENTIAL_KEY" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Release.Namespace }}/simple-erp
        property: {{ $key }}
    {{- end }}
{{- end }}
