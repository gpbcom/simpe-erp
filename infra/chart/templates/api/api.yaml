{{/*
The API: Deployment, Service, HPA, PDB.

Scaled on CPU, which is right here and wrong for the workers — a consumer
waiting on a broker burns no CPU, so the same autoscaler would never scale one
however deep its queue.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simple-erp.fullname" . }}-api
  labels:
    {{- include "simple-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "simple-erp.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simple-erp.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Restarts the pods when the configuration changes. Without it a
        # `helm upgrade` that only edited a rate would report success and
        # change nothing, because a mounted ConfigMap updates in place and
        # nothing re-reads it.
        checksum/config: {{ include (print $.Template.BasePath "/common/config.yaml") . | sha256sum }}
    spec:
      # Long enough for an open server-sent-event stream to drain rather than
      # be severed on every deploy.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "simple-erp.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # No `alembic upgrade` here. Exactly one process migrates, and it is
          # the pre-upgrade hook Job.
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "simple-erp.backendEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          lifecycle:
            preStop:
              exec:
                # Lets the ingress notice the pod is going before it stops
                # answering. Without it the endpoint is removed and the
                # connection cut in either order, and some requests are cut.
                command: ["sleep", "{{ .Values.api.preStopSleepSeconds }}"]
          livenessProbe:
            # Checks nothing but that the process answers. Depending on the
            # database here would restart a healthy API every time the database
            # blinked.
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            # Does check the database, because an API that cannot reach it
            # cannot serve.
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/conf/app.k8s.yaml
              subPath: app.k8s.yaml
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "simple-erp.fullname" . }}-config
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          # Schedule anyway rather than leave a pod Pending. An API short one
          # replica is worse than one unevenly spread.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "simple-erp.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-erp.fullname" . }}-api
  labels:
    {{- include "simple-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "simple-erp.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "simple-erp.fullname" . }}-api
  labels:
    {{- include "simple-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "simple-erp.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "simple-erp.fullname" . }}-api
  labels:
    {{- include "simple-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "simple-erp.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
