# The prod environment's overrides. Everything else comes from values.yaml.
ingress:
  host: simple-erp.local


api:
  autoscaling:
    minReplicas: 3
    maxReplicas: 12

workerPlanning:
  scaling:
    minReplicas: 2
    maxReplicas: 20

  # Its own node pool. A thirty-second core-pinning solve next to the API
  # destroys the API's tail latency, and only production has enough of both for
  # that to matter.
  nodeSelector:
    workload: cpu-bound
  tolerations:
    - key: workload
      operator: Equal
      value: cpu-bound
      effect: NoSchedule

observability:
  # The collector fans out to Tempo, and later to Langfuse.
  tracingEnabled: true
