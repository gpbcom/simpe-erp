services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    restart: unless-stopped

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: simple_erp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    restart: unless-stopped

  backend:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      PLANNING_WEBHOOK_TOKEN: ${PLANNING_WEBHOOK_TOKEN:?PLANNING_WEBHOOK_TOKEN must be set}
      BILLING_WEBHOOK_TOKEN: ${BILLING_WEBHOOK_TOKEN:?BILLING_WEBHOOK_TOKEN must be set}
      # Required, like every other secret here. **Losing this key means
      # every agency must re-enter its certified platform's API key**, so
      # it belongs in the same backup discipline as the database.
      EINVOICING_CREDENTIAL_KEY: ${EINVOICING_CREDENTIAL_KEY:?EINVOICING_CREDENTIAL_KEY must be set}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  migrate:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: "no"

  worker-planning:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          # **Keep equal to planning.solver_workers in conf/app.docker.yaml.**
          # The chart fails to render when the two disagree; compose has no
          # such check, so the same mistake is silent here. Too many threads
          # and the kernel throttles the whole cgroup; too few, and a core is
          # paid for and never used while visits go unplaced for want of
          # search.
          #
          # This said 2.0 while that file said eight workers — the throttling
          # case, and the worst place to have it: eight threads sharing two
          # cores make a unit of the solver's budget cost about four times its
          # measured wall clock, so the safety net fires first and the search
          # is cut short. An unplaced visit at status FEASIBLE is what that
          # looks like to whoever is reading the plan.
          cpus: "8.0"
          memory: 2G

  worker-notifications:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      # The notifications role is what announces an approved invoice. Without
      # this the announcement is refused, and the symptom is invoices that a
      # manager approved and no customer ever received.
      BILLING_WEBHOOK_TOKEN: ${BILLING_WEBHOOK_TOKEN:?BILLING_WEBHOOK_TOKEN must be set}
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  worker-billing:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      BILLING_WEBHOOK_TOKEN: ${BILLING_WEBHOOK_TOKEN:?BILLING_WEBHOOK_TOKEN must be set}
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          # Memory rather than cores: a billing run renders documents, it does
          # not solve. A monthly close is long and I/O-bound, which is exactly
          # why it has a deployment of its own rather than sharing the
          # notification worker's queue.
          cpus: "0.5"
          memory: 768M

  frontend:
    build:
      context: ../../frontend
      target: production
    ports:
      - "80:80"
    restart: unless-stopped
