services:
  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"   # console

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: simple_erp / simple_erp_dev
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI and REST API the tests assert against
    networks: [simple-erp]

  backend:
    build:
      context: ../../backend
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
      PLANNING_WEBHOOK_TOKEN: ${PLANNING_WEBHOOK_TOKEN:-simple-erp-dev-webhook}
      SIMPLE_ERP_LOGGER: ${SIMPLE_ERP_LOGGER:-conf/logger.k8s.yaml}
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ../../backend/api/src:/app/api/src
      - ../../backend/models/src:/app/models/src
      - ../../backend/service/src:/app/service/src
      - ../../backend/storage/src:/app/storage/src
      - ../../backend/worker/src:/app/worker/src
      - ../../backend/conf:/app/conf
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  migrate:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
    volumes:
      - ../../backend/api/src:/app/api/src
      - ../../backend/models/src:/app/models/src
      - ../../backend/service/src:/app/service/src
      - ../../backend/storage/src:/app/storage/src
      - ../../backend/worker/src:/app/worker/src
      - ../../backend/conf:/app/conf

  worker-planning:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
      PLANNING_WEBHOOK_TOKEN: ${PLANNING_WEBHOOK_TOKEN:-simple-erp-dev-webhook}
      SIMPLE_ERP_LOGGER: ${SIMPLE_ERP_LOGGER:-conf/logger.k8s.yaml}
    ports:
      - "9101:9100"
    volumes:
      - ../../backend/api/src:/app/api/src
      - ../../backend/models/src:/app/models/src
      - ../../backend/service/src:/app/service/src
      - ../../backend/storage/src:/app/storage/src
      - ../../backend/worker/src:/app/worker/src
      - ../../backend/conf:/app/conf

  worker-notifications:
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
      PLANNING_WEBHOOK_TOKEN: ${PLANNING_WEBHOOK_TOKEN:-simple-erp-dev-webhook}
      SIMPLE_ERP_LOGGER: ${SIMPLE_ERP_LOGGER:-conf/logger.k8s.yaml}
    ports:
      - "9102:9100"
    volumes:
      - ../../backend/api/src:/app/api/src
      - ../../backend/models/src:/app/models/src
      - ../../backend/service/src:/app/service/src
      - ../../backend/storage/src:/app/storage/src
      - ../../backend/worker/src:/app/worker/src
      - ../../backend/conf:/app/conf
  seed:
    build:
      context: ../../backend
    image: simple-erp-backend:local
    environment:
      SIMPLE_ERP_CONFIG: conf/app.dev.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp_dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-simple_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-simple_erp_dev_secret}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-simple_erp_dev}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../../backend/seed/src:/app/seed/src
      - ../../backend/conf:/app/conf
    command: ["seed"]
    restart: "no"
    networks: [simple-erp]

  frontend:
    build:
      context: ../../frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ../../frontend/src:/app/src
      - ../../frontend/public:/app/public
      - ../../frontend/index.html:/app/index.html
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ../observability/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP over gRPC
      - "4318:4318"   # OTLP over HTTP
    networks: [simple-erp]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=48h
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../chart/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [simple-erp]

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      # Published on 3101, not 3100. The RobotCode VS Code extension runs its
      # language server on 127.0.0.1:3100 whenever a `.robot` file is open, so
      # the container failed to bind whenever somebody had the QA suite in
      # their editor — which looked like a Docker fault and is not one.
      #
      # Only the host mapping moves. Grafana reads `http://loki:3100` and Alloy
      # pushes to the same address, both over the compose network, so nothing
      # inside the stack is affected: this port exists so you can curl Loki
      # from the laptop.
      - "3101:3100"
    networks: [simple-erp]

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [simple-erp]

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../observability/loki/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks: [simple-erp]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks: [simple-erp]

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
