services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simple_erp
      POSTGRES_USER: simple_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_erp -d simple_erp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [simple-erp]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-simple_erp_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-simple_erp_dev_secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [simple-erp]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-simple_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-simple_erp_dev_secret}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
        mc mb --ignore-existing local/simple-erp &&
        mc anonymous set download local/simple-erp &&
        echo 'Bucket simple-erp is ready.'
      "
    networks: [simple-erp]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: simple_erp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-simple_erp_dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [simple-erp]

  backend:
    build:
      context: ./backend
    image: simple-erp-backend:local
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-any-real-deployment}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-simple_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-simple_erp_dev_secret}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-simple_erp_dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PLANNING_WEBHOOK_TOKEN: ${PLANNING_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic -c conf/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    networks: [simple-erp]

  worker:
    build:
      context: ./backend
    image: simple-erp-backend:local
    environment:
      SIMPLE_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp_dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-simple_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-simple_erp_dev_secret}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-simple_erp_dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["worker"]
    networks: [simple-erp]

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    networks: [simple-erp]

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:

networks:
  simple-erp:
    driver: bridge
