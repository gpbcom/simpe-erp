# rt-erp — base stack.
#
# This file describes what the application *is*: five services and the two
# stores they depend on. It is never run alone. Pick an overlay:
#
#   dev   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
#   prod  docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# Everything that differs between the two — bind mounts, reload, exposed ports,
# restart policies, the mail catcher, the seeder — lives in the overlay, so this
# file stays the one description of the system rather than the development one
# with production bolted on.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rt_erp
      POSTGRES_USER: rt_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt_erp_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rt_erp -d rt_erp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rt-erp]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rt_erp_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rt_erp_dev_secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rt-erp]

  # Creates the photograph bucket and makes it readable without a signature.
  # The assistant photographs are the map pins, and a browser loads them with a
  # plain <img src>; a private bucket would leave every pin broken. Runs to
  # completion and exits — it is a step, not a service.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rt_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rt_erp_dev_secret}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
        mc mb --ignore-existing local/rt-erp &&
        mc anonymous set download local/rt-erp &&
        echo 'Bucket rt-erp is ready.'
      "
    networks: [rt-erp]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rt_erp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rt_erp_dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      # The broker takes a while to come up, and a short start period makes
      # every stack launch look like a failure before it succeeds.
      start_period: 20s
    networks: [rt-erp]

  backend:
    build:
      context: ./backend
    environment:
      RT_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt_erp_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-any-real-deployment}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rt_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rt_erp_dev_secret}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rt_erp_dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PLANNING_WEBHOOK_TOKEN: ${PLANNING_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # The API owns the schema: it runs the migrations, and the worker waits for
    # it. Two processes racing to migrate the same database is how a deployment
    # ends up half-upgraded.
    command: >
      sh -c "alembic -c conf/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    networks: [rt-erp]

  worker:
    build:
      context: ./backend
    environment:
      RT_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt_erp_dev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rt_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rt_erp_dev_secret}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rt_erp_dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    # Same image as the API, different entry point. Building one image and
    # running it two ways keeps the two from drifting apart, which is exactly
    # what happens when a worker gets a Dockerfile of its own.
    command: ["worker"]
    networks: [rt-erp]

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    networks: [rt-erp]

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:

networks:
  rt-erp:
    driver: bridge
