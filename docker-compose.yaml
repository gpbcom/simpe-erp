services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rt_erp
      POSTGRES_USER: rt_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt_erp_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rt_erp -d rt_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rt_erp_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rt_erp_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      RT_ERP_CONFIG: conf/app.docker.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt_erp_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-any-real-deployment}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rt_erp_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rt_erp_dev_secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic -c conf/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
volumes:
  postgres-data:
  minio-data:
