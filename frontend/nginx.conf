server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routing. Every path that is not a real file has to return
    # index.html, or a browser refreshed on /quotes/abc gets a 404 from nginx
    # for a route React would have handled.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. With this, the browser never makes a cross-origin request
    # in production and the CORS allow-list stops being load-bearing — it is
    # still configured, for the Vite dev server, which does run cross-origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The notification stream is Server-Sent Events: one response that stays
    # open for hours. Buffering it would hold every frame until the connection
    # closed, turning a live feed into one long silence; the read timeout has to
    # exceed the keep-alive interval or nginx closes an idle-looking stream.
    location /api/v1/notifications/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Hashed filenames, so they can be cached for ever. index.html must not be:
    # it is the file that names the current hashes, and a cached one pins a
    # browser to a deployment that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Never cached, for a sharper version of the same reason. It names the API
    # this deployment talks to, and it is the one file that differs between
    # environments while the image does not — so a cached copy would leave a
    # promoted image pointing at the environment it was promoted *from*.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
